<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picture Me Please</title><link rel="stylesheet" href="/style.css"></head><body><main>
<div class="top"><h1>Admin</h1><button class="alt" onclick="toggleLang()" data-t="lang"></button></div>
<p><a class="btn" href="/dashboard.html" data-t="dash"></a></p>
<div class="card"><label data-t="mall"></label><select id="mallsel"></select></div>
<div class="card"><h2 data-t="slots_title"></h2><small data-t="local_time"></small>
  <div class="filters2"><div><label data-t="from"></label><input id="from" type="date"></div><div><label data-t="to"></label><input id="to" type="date"></div>
  <div><label data-t="open_t"></label><input id="open" type="time" value="10:00"></div><div><label data-t="close_t"></label><input id="close" type="time" value="18:00"></div>
  <div><label data-t="slot_len"></label><input id="len" type="number" value="15" min="5" max="240"></div><div><label data-t="per_slot"></label><input id="cap" type="number" value="2" min="1" max="100"></div></div>
  <button id="mk" data-t="create_slots"></button><p id="smsg"></p></div>
<div class="card"><h2 data-t="sales"></h2><input id="sd" type="date"><div id="sales"></div></div>
<details class="card" id="priceBox"><summary><b data-t="prices_auto"></b></summary><div id="prices"></div><p id="pmsg"></p></details>
<div class="card"><h2 data-t="staff_title"></h2><div id="stlist"></div><input id="stname" data-tp="name" maxlength="40"><select id="strole"><option value="host" data-t="r_host"></option><option value="photographer" data-t="r_photographer"></option><option value="cashier" data-t="r_cashier"></option><option value="admin" data-t="r_admin"></option></select><button id="stadd" data-t="add_staff"></button><p id="stmsg"></p></div>
<div class="card"><h2 data-t="files_title"></h2><input id="fcode" data-tp="code" autocapitalize="characters" maxlength="8"><button id="fload" data-t="files_load"></button><p id="fmsg"></p><div id="flist"></div></div>
<div class="card"><h2 data-t="add_mall"></h2><input id="mname" data-tp="name"><select id="mcountry"><option value="SN">Sénégal</option><option value="CI">Côte d'Ivoire</option><option value="BJ">Bénin</option></select><button id="addmall" data-t="save"></button><p id="mmsg"></p></div>
</main><style>.filters2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}.filters2>*{min-width:0}</style>
<script src="/app.js"></script><script>
const day = (d) => d.toISOString().slice(0, 10);
$('#from').value = day(new Date()); $('#to').value = day(new Date(Date.now() + 6 * 86400000)); $('#sd').value = day(new Date());
const ITEMS = ['essentiel', 'famille', 'prestige', 'numerique', 'print_8x10', 'print_5x7', 'print_4x6', 'wallet', 'digital'];
let MALLS = [], PRICES = [];
const mallId = () => $('#mallsel').value;
const country = () => MALLS.find((m) => String(m.id) === mallId())?.country;
async function showPrices() { // the official price list is pre-loaded per country; inputs only matter if a price changes
  PRICES = await pub('GET', '/api/prices');
  const c = country();
  $('#prices').innerHTML = ITEMS.map((i) => `<div class="item"><span>${t(i)}</span><span><input data-item="${i}" type="number" min="0" step="100" style="width:130px" value="${PRICES.find((p) => p.country === c && p.item === i)?.amount ?? ''}"> F</span></div>`).join('');
}
async function malls(keep) {
  const m = MALLS = await pub('GET', '/api/malls');
  $('#mallsel').innerHTML = m.map((x) => `<option value="${x.id}">${esc(x.name)} (${x.country})</option>`).join('');
  if (keep) $('#mallsel').value = keep; sales(); showPrices();
}
$('#mk').onclick = async () => {
  try { const r = await api('POST', '/api/admin/slots/bulk', { mall: mallId(), fromDay: $('#from').value, toDay: $('#to').value, open: $('#open').value, close: $('#close').value, minutes: $('#len').value, capacity: $('#cap').value });
    $('#smsg').textContent = `${r.created} ${t('slots_done')}`; $('#smsg').className = 'good'; }
  catch (e) { $('#smsg').textContent = errText(e.message); $('#smsg').className = 'err'; }
};
$('#addmall').onclick = async () => { try { await api('POST', '/api/admin/malls', { name: $('#mname').value, country: $('#mcountry').value }); $('#mmsg').textContent = 'OK'; $('#mname').value = ''; malls(mallId()); } catch (e) { $('#mmsg').textContent = errText(e.message); } };
$('#prices').addEventListener('change', async (e) => {
  try { await api('PUT', '/api/admin/prices', { country: country(), item: e.target.dataset.item, amount: +e.target.value }); $('#pmsg').textContent = t(e.target.dataset.item) + ' ✓'; $('#pmsg').className = 'good'; }
  catch (err) { $('#pmsg').textContent = errText(err.message); $('#pmsg').className = 'err'; }
});
async function sales() { if (!mallId()) return; try { const s = await api('GET', `/api/admin/sales?mall=${mallId()}&day=${$('#sd').value}`);
  $('#sales').innerHTML = `<div class="tot">${xof(s.total)}</div>` + Object.entries({ ...s.byMethod, ...s.byProvider }).map(([k, v]) => `<div class="item"><span>${esc(t(k))}</span><span>${xof(v)}</span></div>`).join(''); } catch (e) { $('#sales').textContent = errText(e.message); } }
// Staff: each person gets their own PIN, shown once when created or reset.
const showPin = (name, pin) => { $('#stmsg').innerHTML = `${esc(name)} · ${esc(t('new_pin'))} : <b class="code" style="display:block">${esc(pin)}</b>`; $('#stmsg').className = 'good'; };
const stErr = (e) => { $('#stmsg').textContent = errText(e.message); $('#stmsg').className = 'err'; };
async function staffList() {
  const s = await api('GET', '/api/admin/staff');
  $('#stlist').innerHTML = s.map((x) => `<div class="item"><span>${esc(x.name)} <small>${esc(t('r_' + x.role))}${x.active ? '' : ' · ' + esc(t('inactive'))}</small></span><span><button class="alt" data-reset="${x.id}" data-name="${esc(x.name)}">${esc(t('reset_pin'))}</button> <button class="alt" data-active="${x.id}" data-to="${x.active ? '0' : '1'}">${esc(t(x.active ? 'deactivate' : 'activate'))}</button></span></div>`).join('');
}
$('#stadd').onclick = async () => {
  try { const name = $('#stname').value.trim(); const r = await api('POST', '/api/admin/staff', { name, role: $('#strole').value }); showPin(name, r.pin); $('#stname').value = ''; staffList(); }
  catch (e) { stErr(e); }
};
$('#stlist').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.reset) showPin(b.dataset.name, (await api('POST', '/api/admin/staff/reset', { id: +b.dataset.reset })).pin);
    else { await api('POST', '/api/admin/staff/active', { id: +b.dataset.active, active: b.dataset.to === '1' }); $('#stmsg').textContent = ''; }
    staffList();
  } catch (err) { stErr(err); }
};
window.render = () => { sales(); staffList().catch(stErr); };
$('#fload').onclick = async () => {
  const code = $('#fcode').value.trim().toUpperCase();
  $('#flist').innerHTML = '';
  try { const r = await api('GET', '/api/admin/files?code=' + encodeURIComponent(code));
    $('#fmsg').textContent = !r.paid ? t('not_paid') : r.digital ? t('digital_yes') : t('digital_no'); $('#fmsg').className = r.paid ? 'good' : 'err';
    $('#flist').innerHTML = r.files.map((f) => `<div class="item"><span>${esc(f)}${r.chosen.includes(f) ? ' <b class="good">' + esc(t('chosen')) + '</b>' : ''}</span><button class="alt" data-file="${esc(f)}">${esc(t('download'))}</button></div>`).join('');
    $('#flist').dataset.code = code;
  } catch (e) { $('#fmsg').textContent = errText(e.message); $('#fmsg').className = 'err'; }
};
$('#flist').onclick = async (e) => { // the original is fetched with the admin PIN header and saved as a file
  const f = e.target.dataset.file; if (!f) return;
  try { const r = await fetch(`/photo/${encodeURIComponent($('#flist').dataset.code)}/${encodeURIComponent(f)}`, { headers: { 'x-pin': getPin() } });
    if (!r.ok) throw new Error(r.status === 401 ? 'pin' : 'not found');
    const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = f; a.click(); URL.revokeObjectURL(a.href);
  } catch (err) { $('#fmsg').textContent = errText(err.message); $('#fmsg').className = 'err'; }
};
$('#sd').onchange = sales; $('#mallsel').onchange = () => { sales(); showPrices(); }; applyI18n(); staffList().catch(stErr); malls().catch((e) => { $('#smsg').textContent = errText(e.message); }); setInterval(sales, 10000);
</script></body></html>
