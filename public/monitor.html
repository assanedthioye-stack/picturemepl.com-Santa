<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picture Me Please</title><link rel="stylesheet" href="/style.css"></head><body><main>
<div class="top"><h1 id="who"></h1><button class="alt" onclick="toggleLang()" data-t="lang"></button></div>
<div id="work" hidden>
<p data-t="pick"></p><div class="thumbs" id="th"></div>
<div id="shop"><div class="card"><h2 data-t="packages"></h2><div id="pk"></div><h2 data-t="extras"></h2><div id="ex"></div></div></div>
<div class="card"><div id="lines"></div><div class="tot" id="tot"></div><p class="good" id="paid" hidden data-t="paid"></p><p data-t="pay_at"></p><div class="code" id="code"></div></div>
</div>
<div class="card" id="dlbox" hidden><b data-t="dl"></b><div id="dl"></div></div>
<p id="wait" class="big" data-t="waiting_family"></p>
</main><script src="/app.js"></script><script>
const PK = ['essentiel', 'famille', 'prestige', 'numerique'], EX = ['print_8x10', 'print_5x7', 'print_4x6', 'wallet', 'digital'];
let code = null, files = [], sel = new Set(), qty = {}, country = 'SN', prices = {}, paid = false, seq = 0, urls = [];
const unit = (i) => prices[country + i] || 0;
const stepper = (i) => `<div class="item"><span>${t(i)} <small>${xof(unit(i))}</small></span><span class="n"><button class="alt" data-step="-1" data-item="${i}">−</button><b>${qty[i] || 0}</b><button data-step="1" data-item="${i}">+</button></span></div>`;
function lines(o) {
  $('#lines').innerHTML = o.lines.map((l) => `<div class="item"><span>${l.qty}× ${t(l.item)} ${l.discounted ? '<b class="good">' + t('discount') + '</b>' : ''}</span><span>${xof(l.amount)}</span></div>`).join('');
  $('#tot').textContent = o.lines.length ? t('total') + ' ' + xof(o.total) : '';
}
async function cart() {
  if (paid || !code) return;
  $('#pk').innerHTML = PK.map(stepper).join(''); $('#ex').innerHTML = EX.map(stepper).join('');
  const items = Object.entries(qty).filter(([, q]) => q > 0).map(([item, q]) => ({ item, qty: q }));
  const mine = ++seq; // only the latest request may update the screen: slow earlier answers are stale
  try { const r = await api('POST', '/api/cart', { code, items, files: [...sel] }); if (mine === seq) lines(r); }
  catch (e) { if (mine === seq) $('#tot').textContent = errText(e.message); }
}
$('#shop').onclick = (e) => { const b = e.target.closest('button[data-item]'); if (!b || paid) return; const i = b.dataset.item; qty[i] = Math.min(20, Math.max(0, (qty[i] || 0) + +b.dataset.step)); cart(); };
async function thumbs() {
  const forCode = code, list = files.slice();
  const made = await Promise.all(list.map((f) => photoSrc(forCode, f).catch(() => '')));
  if (forCode !== code) { made.forEach((u) => u && URL.revokeObjectURL(u)); return; }
  urls.forEach((u) => u && URL.revokeObjectURL(u)); urls = made;
  $('#th').innerHTML = '';
  list.forEach((f, k) => { const im = document.createElement('img'); im.src = made[k]; im.alt = f; im.className = sel.has(f) ? 'on' : '';
    im.onclick = () => { if (paid) return; sel.has(f) ? sel.delete(f) : sel.add(f); im.className = sel.has(f) ? 'on' : ''; cart(); }; $('#th').append(im); });
}
async function refresh() {
  try {
    const a = await api('GET', '/api/active?mall=' + mall);
    if (!a) { code = null; paid = false; $('#dlbox').hidden = true; $('#work').hidden = true; $('#wait').hidden = false; $('#who').textContent = ''; return; }
    if (a.code !== code) { code = a.code; files = []; sel = new Set(); qty = {}; paid = false; $('#who').textContent = a.name; $('#code').textContent = code; $('#work').hidden = false; $('#wait').hidden = true; $('#lines').innerHTML = $('#tot').textContent = ''; cart(); }
    const g = await api('GET', '/api/gallery/' + a.code);
    if (a.code === code && g.length !== files.length) { files = g; thumbs(); }
    const o = await api('GET', '/api/order?code=' + code).catch(() => null);
    paid = !!(o && o.paid);
    $('#paid').hidden = !paid; $('#shop').hidden = paid;
    if (paid) lines(o);
    $('#dlbox').hidden = !(paid && o.downloads);
    if (paid && o.downloads) $('#dl').innerHTML = o.downloads.map((f) => `<a href="/dl/${encodeURIComponent(code)}/${encodeURIComponent(f)}">${esc(f)}</a>`).join('<br>');
  } catch (e) { /* shown on the next successful poll; a wrong PIN re-prompts */ }
}
window.render = cart; applyI18n();
initMall().then(async (m) => {
  country = m.country;
  for (const p of await pub('GET', '/api/prices')) prices[p.country + p.item] = p.amount;
  refresh(); setInterval(refresh, 2000);
}).catch((e) => { $('#wait').textContent = errText(e.message); });
</script></body></html>
